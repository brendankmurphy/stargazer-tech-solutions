<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo preview (not part of the site)</title>
<style>
  body { font-family: Poppins, Gellix, system-ui, sans-serif; margin: 0; padding: 40px; background: #eef1f6; color: #0b1324; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; margin-bottom: 32px; }
  .panel { padding: 32px; border-radius: 16px; display: flex; align-items: center; gap: 16px; }
  .light { background: #fff; } .dark { background: #0b1324; color: #fff; }
  .name { font-weight: 700; font-size: 22px; line-height: 1.1; }
  .sub { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
</style>
</head>
<body>
<h1>Orion logo preview</h1>
<div class="row">
  <img src="logo-orion.svg" width="320" height="320" alt="Orion logo, large">
  <img src="logo-orion.svg" width="96" height="96" alt="Orion logo, medium">
  <img src="logo-orion.svg" width="40" height="40" alt="Orion logo, header size">
  <img src="logo-orion.svg" width="16" height="16" alt="Orion logo, favicon size">
</div>
<div class="row">
  <div class="panel dark"><img src="logo-orion.svg" width="56" height="56" alt=""><div><div class="name">Stargazer</div><div class="sub">Technology Solutions</div></div></div>
  <div class="panel light"><img src="logo-orion.svg" width="56" height="56" alt=""><div><div class="name">Stargazer</div><div class="sub">Technology Solutions</div></div></div>
</div>
</body>
</html>
