<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Send a support request to Stargazer Technology Solutions LLC.">
<title>Contact and Support &ndash; Stargazer Technology Solutions LLC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<div class="page">
  <div class="page-head">
    <svg class="emblem emblem--mark" viewBox="0 0 400 400" aria-hidden="true" focusable="false">
      <ellipse cx="200" cy="200" rx="190" ry="68" transform="rotate(-18 200 200)" class="emblem-orbit" />
      <circle cx="200" cy="200" r="190" class="emblem-ring-outer" />
      <circle cx="200" cy="200" r="163" class="emblem-ring-inner" />
      <g class="emblem-ticks-major">
        <line x1="200" y1="10" x2="200" y2="30" />
        <line x1="200" y1="10" x2="200" y2="30" transform="rotate(90 200 200)" />
        <line x1="200" y1="10" x2="200" y2="30" transform="rotate(180 200 200)" />
        <line x1="200" y1="10" x2="200" y2="30" transform="rotate(270 200 200)" />
      </g>
      <path class="emblem-spark" d="M200,2 C202,10 204,12 212,14 C204,16 202,18 200,26 C198,18 196,16 188,14 C196,12 198,10 200,2 Z" />
    </svg>
    <h1 class="page-title">Contact and Support</h1>
    <div class="rule"></div>
  </div>

  <div class="page-body">
    <form class="support-form" action="https://formsubmit.co/brendan@stargazertechsolutions.com" method="POST">
      <input type="hidden" name="_subject" value="New support request — Stargazer Technology Solutions">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="true">
      <input type="text" name="_honey" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="form-submit">Send message</button>
    </form>

    <dl class="field-list field-list--footnote">
      <div class="field">
        <dt>Hours</dt>
        <dd>8:00 AM &ndash; 5:00 PM Mountain Time</dd>
      </div>
    </dl>
  </div>
</div>

<div class="footer-links">
  <a href="index.html">Home</a>
  |
  <a href="privacy.html">Privacy Policy</a>
</div>

</body>
</html>
